<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Hydra TUI render</title>
<script src="https://unpkg.com/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css" />
<style>
  /* Everything around the terminal is the terminal's OWN background, so there is no foreign colour that
     can leak into a capture — screenshot.mjs then trims to the content and pads it itself. A contrasting
     frame used to sit here as a tripwire for a broken crop; two of its pixels ended up down the left edge
     of the committed PNG and stayed there, which is what a tripwire nobody checks is worth. */
  html, body { margin: 0; background: #0c0c0c; }
  body { padding: 24px; display: flex; justify-content: center; }
  #wrap { display: inline-block; padding: 16px; background: #0c0c0c; }
</style>
</head>
<body>
<div id="wrap"><div id="term"></div></div>
<script>
  (async function () {
    const meta = await fetch('meta.json').then((r) => r.json()).catch(() => ({ cols: 130, rows: 42 }));
    const term = new Terminal({
      cols: meta.cols,
      rows: meta.rows,
      fontFamily: 'Menlo, "SF Mono", Consolas, "Liberation Mono", monospace',
      fontSize: 13,
      lineHeight: 1.0,
      theme: { background: '#0c0c0c' },
      allowProposedApi: true,
    });
    term.open(document.getElementById('term'));

    const b64 = await fetch('capture.b64').then((r) => r.text());
    const binary = atob(b64.trim());
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    term.write(bytes);
    window.__renderDone = true;
  })();
</script>
</body>
</html>
