name: Build Hydra

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: build-hydra
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            patch="${latest#v}"
            patch="${patch#0.1.}"
            echo "version=0.1.$((patch + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            # xvfb-run provides a headless X server + DISPLAY so the real X11 selection tests execute here
            wrapper: xvfb-run -a
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install X11 headless deps
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && xargs sudo apt-get install -y -qq < .github/linux-test-packages.txt

      - name: Restore
        run: dotnet restore Hydra.sln

      - name: Test
        run: ${{ matrix.wrapper }} dotnet test Hydra.sln --no-restore

  # the TUI end to end, through a real pty and xterm.js; macOS because node-pty ships prebuilds for it
  test-tui:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HydraWebConfig/tools/tui-tests/package-lock.json

      - name: Build Hydra
        run: dotnet build Hydra --configuration Release

      - name: Install dependencies
        working-directory: HydraWebConfig/tools/tui-tests
        run: npm ci && npx playwright install chromium

      - name: Test
        working-directory: HydraWebConfig/tools/tui-tests
        run: npm test

  build:
    runs-on: macos-latest
    needs: [version]

    strategy:
      matrix:
        rid: [osx-arm64, win-x64, linux-x64, linux-arm64]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Hydra (${{ matrix.rid }})
        run: dotnet publish Hydra --runtime ${{ matrix.rid }} --self-contained -p:Version=${{ needs.version.outputs.version }}

      - name: Package artifact
        env:
          RID: ${{ matrix.rid }}
        run: |
          cd "Hydra/bin/Release/net10.0/$RID/publish"
          tar czf "$GITHUB_WORKSPACE/hydra-$RID.tar.gz" --exclude='*.pdb' .
          if [[ "$RID" == win-* ]]; then
            zip -r "$GITHUB_WORKSPACE/hydra-$RID.zip" . -x '*.pdb'
          fi

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: hydra-${{ matrix.rid }}
          path: hydra-${{ matrix.rid }}.*

  release:
    needs: [build, test, test-tui, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "Hydra ${{ needs.version.outputs.version }}" \
            --generate-notes \
            hydra-osx-arm64/hydra-osx-arm64.tar.gz \
            hydra-win-x64/hydra-win-x64.tar.gz \
            hydra-win-x64/hydra-win-x64.zip \
            hydra-linux-x64/hydra-linux-x64.tar.gz \
            hydra-linux-arm64/hydra-linux-arm64.tar.gz

      - name: Prune old releases (keep last 5)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --json tagName --jq '.[5:][].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
