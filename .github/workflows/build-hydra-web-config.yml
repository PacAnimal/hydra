name: Build HydraWebConfig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HydraWebConfig/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: HydraWebConfig

      - name: Run tests
        run: npm test
        working-directory: HydraWebConfig

  build:
    needs: test
    # Publishing a container image only makes sense from the repo that owns the registry
    # namespace it publishes to. A fork inherits none of the parent repo's variables, so this
    # is off by default there and only needs enabling once, on this repo, via a repository
    # variable (Settings → Secrets and variables → Actions → Variables): PUBLISH_HYDRA_WEB_CONFIG=true.
    if: ${{ vars.PUBLISH_HYDRA_WEB_CONFIG == 'true' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image references must be lowercase; github.repository_owner isn't guaranteed to be.
      - name: Compute lowercase image owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: HydraWebConfig
          file: HydraWebConfig/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/hydra-web-config:latest
