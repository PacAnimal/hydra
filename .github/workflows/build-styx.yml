name: Build Styx

# main pushes styx:latest, edge pushes styx:edge
on:
  push:
    branches: [main, edge]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      context: .
      file: Styx/Dockerfile
      image: styx
      tag: ${{ github.ref_name == 'edge' && 'edge' || 'latest' }}
